<meta name="description" content="Stylix مولّد زخرفة النصوص والأسماء: حوّل أي نص إلى آلاف الأنماط والخطوط المميزة القابلة للنسخ، مجانًا وداخل متصفحك.">
<style>
:root{--bg:#07060f;--p:#8b5cf6;--b:#38bdf8;--t:#f4f2ff;--m:#9a97b8;--g:rgba(255,255,255,.06);--br:rgba(255,255,255,.12);--inp:rgba(0,0,0,.25);--gl:rgba(255,255,255,.05);--h1:#fff}
:root[data-theme=light]{--bg:#f4f3ff;--t:#171533;--m:#5f5c80;--g:rgba(20,10,80,.06);--br:rgba(20,10,80,.14);--inp:rgba(255,255,255,.85);--gl:rgba(255,255,255,.7);--h1:#1e1b4b}
[data-theme=light] .bl{opacity:.12}[data-theme=light] .glass{box-shadow:0 8px 28px rgba(60,40,140,.12)}[data-theme=light] .brand img{filter:invert(1)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--t);font-family:"Segoe UI","Noto Sans Arabic",Tahoma,system-ui,sans-serif;min-height:100vh;overflow-x:hidden;line-height:1.6}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bl{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.3;animation:fl 22s ease-in-out infinite alternate}
.b1{background:#ec4899;top:-25%;right:-20%;opacity:.16}.b2{background:#6366f1;bottom:-30%;left:-20%;animation-delay:-8s;opacity:.22}.b3{background:#14b8a6;top:40%;left:30%;width:30vmax;height:30vmax;opacity:.1;animation-delay:-14s}
.grid{position:absolute;inset:0;background:linear-gradient(var(--g) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--g) 1px,transparent 1px) 0 0/48px 48px;-webkit-mask:radial-gradient(ellipse at 50% 30%,#000,transparent 70%);mask:radial-gradient(ellipse at 50% 30%,#000,transparent 70%)}
.ring{position:absolute;border:1px solid var(--br);border-radius:50%;width:70vmin;height:70vmin;top:8%;left:50%;margin-left:-35vmin;animation:sp 60s linear infinite}
.ring.r2{width:95vmin;height:95vmin;margin-left:-47.5vmin;top:-2%;border-style:dashed;animation-duration:90s;animation-direction:reverse}
#fx{position:absolute;inset:0}
@keyframes fl{to{transform:translate(-8%,10%) scale(1.15)}}@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pop{50%{transform:scale(1.18)}}@keyframes up{from{opacity:0;transform:translateY(12px)}}
.wrap{max-width:1040px;margin:auto;padding:20px 16px}
nav{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.logo{display:flex;align-items:center;gap:10px;font-size:1.5rem;font-weight:800;letter-spacing:.5px;text-decoration:none;color:var(--t)}
.logo svg{width:34px;height:34px;filter:drop-shadow(0 0 10px rgba(139,92,246,.7))}.logo span{background:linear-gradient(90deg,var(--h1),#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:.8rem;color:var(--m)}
.brand{display:flex;flex-direction:column;align-items:center;margin-top:18px}.brand img{height:clamp(96px,22vw,128px);width:auto;opacity:.95}.n777{display:flex;align-items:center;gap:12px;margin-top:-2px;color:var(--t);direction:ltr}.n777 span{font-size:1.05rem;letter-spacing:.45em;margin-right:-.45em;font-weight:300}.n777 i{display:block;width:34px;height:1px;background:currentColor;opacity:.7}
.hero{text-align:center;padding:36px 0 22px}
h1{font-size:clamp(2rem,7vw,3.6rem);line-height:1.25;background:linear-gradient(120deg,var(--h1),#8b5cf6 45%,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--m);margin-top:10px;font-size:clamp(1rem,3vw,1.2rem)}
.glass{background:var(--gl);border:1px solid var(--br);border-radius:22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.box{padding:14px;display:flex;flex-direction:column;gap:12px}
textarea{width:100%;min-height:130px;resize:vertical;background:var(--inp);border:1px solid var(--br);border-radius:16px;color:var(--t);font:inherit;font-size:1.15rem;padding:14px;outline:0;transition:.25s}
textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(139,92,246,.25),0 0 30px rgba(139,92,246,.35)}
button{font:inherit;cursor:pointer;color:var(--t);border:1px solid var(--br);background:var(--g);border-radius:12px;padding:8px 14px;transition:.2s}
button:hover{background:rgba(255,255,255,.12);border-color:var(--p)}
.go{font-size:1.2rem;font-weight:700;padding:15px;border:0;border-radius:16px;background:linear-gradient(120deg,var(--p),var(--b));box-shadow:0 6px 28px rgba(139,92,246,.5)}
.go:hover{transform:translateY(-2px);filter:brightness(1.1)}
.note{font-size:.85rem;color:#fbbf24;display:none}
#res{margin-top:34px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
h2{font-size:1.6rem}.cnt{color:var(--m)}.cnt b{color:var(--b)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.tools input{flex:1;min-width:160px;background:var(--inp);border:1px solid var(--br);border-radius:12px;color:var(--t);font:inherit;padding:8px 14px;outline:0}
.tools input:focus{border-color:var(--p)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:thin}
.tabs button{white-space:nowrap;border-radius:99px}
.tabs button.on{background:linear-gradient(120deg,var(--p),var(--b));border-color:transparent}
#feat{display:none;padding:22px;text-align:center;margin-bottom:14px;animation:up .4s}
#feat .t{font-size:clamp(1.5rem,6vw,2.4rem);word-break:break-word;margin-bottom:12px;text-shadow:0 0 22px rgba(139,92,246,.7)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;max-width:820px;margin:auto}@media(max-width:600px){.list{max-width:380px}}
.card{display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:54px;animation:up .35s both;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:var(--p);box-shadow:0 8px 30px rgba(139,92,246,.3)}
.card .t{flex:1;font-size:1.1rem;text-align:center;overflow-wrap:anywhere;unicode-bidi:plaintext}
.act{display:flex;gap:6px}
.act button{width:36px;height:36px;padding:0;border-radius:10px;display:grid;place-items:center;font-size:1rem}.act svg{width:17px;height:17px}

.ok{animation:pop .4s;background:#16a34a!important;border-color:#16a34a!important}
.fv{color:#f472b6}
.more{display:block;margin:22px auto;padding:12px 30px}
.go,.tabs button.on,.ok{color:#fff!important}
nav.bar{position:sticky;top:8px;z-index:30;padding:8px 12px;margin-top:4px;border-radius:16px}.ctl{display:flex;gap:8px}.cb{height:38px;min-width:38px;padding:0 12px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:.95rem}.cb svg{width:18px;height:18px}@media(max-width:480px){.cb .lb{display:none}}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:99px;background:#16a34a;color:#fff;opacity:0;pointer-events:none;transition:.3s;z-index:99}#toast.on{opacity:1}
.ad{margin:16px auto;max-width:820px;text-align:center}.ad:empty{display:none}
.empty{text-align:center;color:var(--m);padding:40px}
section.info{margin-top:50px;padding:22px;display:grid;gap:14px;color:var(--m)}
section.info h3{color:var(--t)}
footer{text-align:center;margin:40px 0 20px;color:var(--m)}
footer b{display:block;color:var(--t);font-size:1.3rem}
footer a{color:var(--m);margin:0 10px;text-decoration:none}footer a:hover{color:var(--b)}
@media(min-width:700px){.box{flex-direction:row;align-items:stretch}.go{min-width:190px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const _c=document.createElement('canvas');_c.width=_c.height=32;const _x=_c.getContext('2d',{willReadFrequently:true});

const TOFU=sig('\u{10FFFF}'),okc=new Map();

/* ===== Generator ===== */
function gen(text){
const out=new Map(),ar=/[\u0600-\u06FF]/.test(text),long=text.length>40,dg=(text.match(/\d/g)||[]).join('');
const add=(t,n,c)=>{if(t.trim()&&!out.has(t))out.set(t,{t,n,c})};
const B=[];
FONTS.forEach(([n,f],i)=>{const c=['fonts',i?'unicode':'minimal'];if(dg&&f(dg)!==dg)c.push('numbers');B.push({t:f(text),n,c,i})});
B.forEach(b=>add(b.t,b.n,b.c));
if(!ar){
[0,1,5,13,9].forEach(i=>MARKS.forEach(([m,mc],j)=>{const t=[...FONTS[i][1](text)].map(ch=>/\s/.test(ch)?ch:ch+mc).join('');add(t,FONTS[i][0]+' '+m,j%3?['glitch']:['glitch','dark'])}));
if(!long)[0,1,5,8,13,19].forEach(i=>SEPS.forEach(([s,k])=>add([...FONTS[i][1](text)].join(s),FONTS[i][0]+' '+k,[k,'fonts'])));}
const all=B.concat([...out.values()].filter(x=>!B.includes(x)&&0));
const fr=PAIRS.flatMap(g=>long?g.slice(0,4):g);
const pool=[...out.values()].slice();
fr.forEach(([l,r,k])=>pool.forEach(b=>add(l+b.t+r,b.n+' '+k+' '+(AR[k]||''),[...b.c,k,...(k=='frames'?[]:['frames']).slice(0,0)])));
if(!long){const O=PAIRS[2].slice(0,8),I=PAIRS[0].slice(0,10);
O.forEach(([ol,or])=>I.forEach(([il,ir])=>B.slice(0,8).forEach(b=>add(ol+il+b.t+ir+or,b.n+' royal فخم frames',['royal','fancy','frames',...b.c]))))}
return[...out.values()].filter(x=>[...x.t].every(okg))}

const T={ar:{h1:'حوّل كلماتك إلى شيء مميز',sub:'اكتب أي نص واحصل على آلاف الأنماط المميزة القابلة للنسخ.',ph:'اكتب اسمك أو النص الذي تريد زخرفته...',go:'✦ تحويل النص',busy:'جاري إنشاء الأنماط...',note:'الحروف العربية لا تدعم خطوط Unicode أو التأثيرات، لذلك طُبّقت الإطارات والرموز فقط.',res:'النتائج',made:n=>'تم إنشاء '+n+' نمطًا',cnt:n=>n+' نمطًا',sp:'ابحث عن نمط...',rnd:'🎲 عشوائي',cpa:'📋 نسخ جميع النتائج',more:'عرض المزيد',empty:'لا توجد نتائج',conf:n=>'ستنسخ '+n+' نمط. متابعة؟',copy:'نسخ',copied:'✓ تم النسخ',share:'مشاركة',inv:'دعوة',invt:'جرّب Stylix – مولّد زخارف النصوص:',link:'تم نسخ الرابط',tab_all:'الكل',tab_fonts:'خطوط',tab_gaming:'Gaming',tab_fancy:'فخم',tab_royal:'ملكي',tab_symbols:'رموز',tab_frames:'إطارات',tab_glitch:'Glitch',tab_dark:'Dark',tab_cute:'Cute',tab_minimal:'Minimal',tab_unicode:'Unicode',tab_numbers:'أرقام',tab_fav:'♥ المفضلة',ab:'حول الموقع',abp:'Stylix مولّد زخارف يدمج خطوط Unicode والإطارات والرموز والتأثيرات لإنتاج آلاف النتائج الفريدة.',pv:'الخصوصية',pvp:'تتم المعالجة محليًا في متصفحك. لا نرسل نصوصك إلى أي خادم ولا نجمع أي بيانات.',ct:'تواصل معنا',ft:'مولّد الكتابات والأنماط المميزة',home:'الرئيسية'},
en:{h1:'Turn your words into something special',sub:'Type any text and get thousands of unique, copyable styles.',ph:'Type your name or the text to style...',go:'✦ Convert text',busy:'Generating styles...',note:'Arabic letters do not support Unicode fonts or effects, so only frames, ornaments and symbols were applied.',res:'Results',made:n=>n+' styles generated',cnt:n=>n+' Styles',sp:'Search styles...',rnd:'🎲 Random',cpa:'📋 Copy all results',more:'Show more',empty:'No results',conf:n=>'You are about to copy '+n+' styles. Continue?',copy:'Copy',copied:'✓ Copied',share:'Share',inv:'Invite',invt:'Try Stylix – a text style generator:',link:'Link copied',tab_all:'All',tab_fonts:'Fonts',tab_gaming:'Gaming',tab_fancy:'Luxury',tab_royal:'Royal',tab_symbols:'Symbols',tab_frames:'Frames',tab_glitch:'Glitch',tab_dark:'Dark',tab_cute:'Cute',tab_minimal:'Minimal',tab_unicode:'Unicode',tab_numbers:'Numbers',tab_fav:'♥ Favorites',ab:'About',abp:'Stylix combines Unicode fonts, frames, symbols and effects to produce thousands of unique text styles.',pv:'Privacy',pvp:'Everything is processed locally in your browser. We never send your text to any server or collect data.',ct:'Contact Us',ft:'Unique text & style generator',home:'Home'}};
const tr=(k,...a)=>{const v=(T[lang]||T.ar)[k];return typeof v=='function'?v(...a):v};
const setTotal=()=>{$('#total').textContent=tr('made',fmt(ALL.length))};
/* ===== UI ===== */
let ALL=[],cat='all',q='',shown=60,view=[],favs=[];
try{favs=JSON.parse(localStorage.getItem('stylix_fav')||'[]')}catch(e){}
const saveF=()=>{try{localStorage.setItem('stylix_fav',JSON.stringify(favs))}catch(e){}};
const fmt=n=>n.toLocaleString('en-US');
function copy(t,btn,lab='نسخ'){const done=()=>{if(!btn)return;const o=btn.innerHTML;btn.textContent=btn.classList.contains('ic')?'✓':tr('copied');btn.classList.add('ok');setTimeout(()=>{btn.innerHTML=o;btn.classList.remove('ok')},1300)};
if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,()=>fb());else fb();
function fb(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()}}
function filt(){const s=q.trim().toLowerCase();
let src=cat=='fav'?favs.map(t=>({t,n:'favorite مفضلة',c:[]})):ALL.filter(x=>cat=='all'||x.c.includes(cat));
view=s?src.filter(x=>x.t.toLowerCase().includes(s)||x.n.toLowerCase().includes(s)):src}
function draw(reset=true){if(reset)shown=60;filt();const L=$('#list'),adr=$('#ad-real-results');document.body.prepend(adr);L.innerHTML='';
$('#cnt').textContent=tr('cnt',fmt(view.length));

view.slice(0,shown).forEach((x,i)=>{const c=document.createElement('div');c.className='card glass';c.style.animationDelay=Math.min(i%20,12)*18+'ms';

const cb=document.createElement('button');cb.className='ic';cb.title=tr('copy');cb.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';cb.onclick=()=>copy(x.t,cb);
const r=document.createElement('div');r.style.cssText='display:flex;gap:6px';
const h=document.createElement('button');h.className='ic';const hs=()=>{const f=favs.includes(x.t);h.textContent=f?'♥':'♡';h.classList.toggle('fv',f)};hs();
h.onclick=()=>{favs=favs.includes(x.t)?favs.filter(v=>v!=x.t):[x.t,...favs];saveF();if(cat=='fav')draw(false);else hs()};
const sh=document.createElement('button');sh.className='ic';sh.textContent='↗';sh.title=tr('share');
sh.onclick=()=>{if(navigator.share)navigator.share({text:x.t}).catch(()=>{});else copy(x.t,cb)};
a.append(cb,h,sh);c.append(t,a);L.append(c)});
if(view.length>6){const an=document.createElement('div');an.id='ad-anchor-results';an.style.gridColumn='1/-1';L.insertBefore(an,L.children[6]);an.appendChild(adr)}
$('#more').style.display=view.length>shown?'block':'none'}
function run(){const t=$('#in').value.trim();if(!t){$('#in').focus();return}const g=$('#go');g.textContent=tr('busy');g.disabled=true;
setTimeout(()=>{ALL=gen(t);$('#res').style.display='block';setTotal();$('#note').style.display=/[\u0600-\u06FF]/.test(t)?'block':'none';$('#feat').style.display='none';cat=cat=='fav'?'fav':'all';tabs();draw();g.textContent=tr('go');g.disabled=false;
$('#res').scrollIntoView({behavior:'smooth'})},30)}
function tabs(){const T=$('#tabs');T.innerHTML='';TABS.forEach(([k,l])=>{const b=document.createElement('button');b.textContent=tr('tab_'+k);if(k==cat)b.className='on';b.onclick=()=>{cat=k;tabs();draw()};T.append(b)})}
$('#go').onclick=run;

$('#more').onclick=()=>{shown+=120;draw(false)};

const cv=$('#fx'),cx=cv.getContext('2d');let W,H;const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};rs();addEventListener('resize',rs);

(function L(){cx.clearRect(0,0,W,H);cx.fillStyle=root.dataset.theme=='light'?'rgba(110,90,220,.5)':'rgba(190,180,255,.55)';for(const p of P){p.x=(p.x+p.vx+W)%W;p.y=(p.y+p.vy+H)%H;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}if(!reduce)requestAnimationFrame(L)})();
